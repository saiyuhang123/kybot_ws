brain_node:
  ros__parameters:
    # DeepSeek OpenAI 兼容端点。真实 Key 放在仓库外部，避免进入 Git。
    api_base: "https://api.deepseek.com"
    model: "deepseek-v4-flash"
    api_key: ""  # 仅保留为手动覆盖入口，不要在仓库中填写真实 Key
    api_key_file: "/home/nvidia/apiFlies/api.yaml"
    api_key_field: "deepseekapi"
    # 点位白名单 (RViz 面板保存的文件, brain 每次调用前重新读取)
    waypoints_file: "/home/nvidia/kybot_ws/location/location.yaml"
    llm_timeout_sec: 60.0
    service_timeout_sec: 10.0
    nav_timeout_sec: 300.0    # navigate_and_wait 等导航终态的上限
    arm_timeout_sec: 130.0    # 机械臂 Trigger 调用上限 (elite 侧最长约 120s)
    polish_timeout_sec: 1020.0 # 含底层900s工艺超时后的安全取消收尾等待
    end_effector_mode: "twofinger"  # launch 面板会按实际选择覆盖
    history_max: 20
    audit_file: "~/.kybot_brain/audit.jsonl"
