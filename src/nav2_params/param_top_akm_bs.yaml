bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0                #与model_dt=0.1匹配，1/0.1=10Hz
    # min_x_velocity_threshold: -0.35           #最小 x 速度阈值
    # min_y_velocity_threshold: 0.35             #最小 y 速度阈值
    # min_theta_velocity_threshold: 0.001       #最小速度阈值
    odom_topic: /odometry/filtered
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5            #所需运动半径
      movement_time_allowance: 10.0            #移动时间容差
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1 # 0.3                  #xy 目标容差
      yaw_goal_tolerance: 0.05 # 0.3                #yaw目标容差
      stateful: True

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController" #MPPI控制器
      time_steps: 56    #从40增加到56，延长预测范围到5.6s=1.12m
      model_dt: 0.1    #每个时间步长的时间步长的长度dt（以秒为单位）是预测范围
      batch_size: 500  #在给定迭代中从当前最佳控制序列中随机采样的候选轨迹的数量  2000
      vx_std: 0.12       #Vx 抽样标准差，约为vx_max(0.5)的25%
      vy_std: 0.0       #Vy 的抽样标准差
      wz_std: 0.25       #Wz 抽样标准差，约为wz_max(0.62)的40%
      vx_max: 0.25      #目标最大前进速度（米/秒）
      vx_min: -0.30     #目标最大反向速度（米/秒）
      vy_max: 0.0       #如果使用Omni运动模型，目标最大横向速度（m/s）
      wz_max: 0.62       #匹配vx_max/min_turning_r = 0.5/0.8 = 0.625 rad/s
      ax_max: 1.0     #匹配vx_max=0.5，0.5s内可加速到最大
      ax_min: -1.0
      ay_max: 0.0
      az_max: 1.2     #与wz_max=0.62配套
      iteration_count: 2 #迭代次数，从1增加到2，提高轨迹优化质量
      prune_distance: 4.0 #从1.5增加到4.0，让MPPI提前看到转弯
      enforce_path_inversion: true
      transform_tolerance: 0.1 #使用 TF（s）进行数据转换的时间容差
      temperature: 0.3 #从0.2提高到0.3，增加轨迹平均的平滑效果减少输出跳变
      gamma: 0.015 #平滑度（高）和低能耗（低）之间的权衡,保持默认值
      motion_model: "Ackermann" #用于轨迹规划的所需运动模型。选项包括DiffDrive、Omni或Ackermann。
      visualize: true #开启可视化，在RViz中查看MPPI候选轨迹诊断问题
      TrajectoryVisualizer: #轨迹可视化
        trajectory_step: 5 #轨迹之间的步骤可视化以对候选轨迹池进行下采样
        time_step: 3 #轨迹上点之间的步骤可视化以降低轨迹密度的采样
      AckermannConstraints:
        min_turning_r: 0.80 #最小转弯半径，实测直径1.6m→半径0.8m
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"] #评论插件
      ConstraintCritic: #修复超出设定的动态或运动学约束的轨迹
        enabled: true
        cost_power: 1 
        cost_weight: 4.0  #权重参数
      
      GoalAngleCritic: #当距离目标较近时，GoalAngleCritic会激励导航以达到目标姿势的角度
        enabled: true
        cost_power: 1
        cost_weight: 3.0 #权重参数
        threshold_to_consider: 0.5  #考虑阈值：机器人与目标之间的最小距离（米），超过此距离则考虑角度目标成本

      GoalCritic: #当距离目标较近时，GoalCritic会激励机器人在空间上向目标导航
        enabled: true
        cost_power: 1
        cost_weight: 15.0 #权重参数
        threshold_to_consider: 1.4  #机器人与目标之间的最小距离（米），超过此距离则要考虑目标距离成本。

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 2.0 #权重参数，通常优先选择成本较低的空间中的路线。
        critical_weight: 45.0 #应用于临界碰撞的权重，恢复到接近原来的50.0以增强避障
        consider_footprint: false #必须为false，true时20K次SE2足迹检查在20Hz下算不完
        collision_cost: 10000.0 #应用于轨迹中真实碰撞的成本。
        collision_margin_distance: 0.20 #碰撞边缘距离
        near_goal_distance: 0.4 #靠近目标的距离（米）停止应用优先障碍物项
        cost_scaling_factor: 6.0
        inflation_radius: 0.3  #从0.5降到0.3，与代价地图分层：代价地图保底，MPPI做动态避障

      PreferForwardCritic: #激励机器人前进，而不是后退
        enabled: true
        cost_power: 1
        cost_weight: 0.5 #权重参数
        threshold_to_consider: 0.5 #机器人与目标之间的距离（米）停止考虑前锋并允许目标批评家接管。
      # Option to replace Cost and use Obstacles instead

      PathAlignCritic:  #PathAlignCritic会激励机器人与全局路径保持一致。它不实现路径跟随行为。
        enabled: true
        cost_power: 1
        cost_weight: 5.0 #权重参数
        max_path_occupancy_ratio: 0.07 #最大路径占用率
        trajectory_point_step: 4
        threshold_to_consider: 0.5 #机器人与目标之间的距离阈值，阈值符合则停止考虑路径对齐并允许目标批评家接管。
        offset_from_furthest: 20 #最远偏移量
        use_path_orientations: true #是否在路径对齐中考虑路径的方向

      PathAngleCritic: #路径角度评论，机器人在因累积角度误差较大而需要时进行急转弯。
        enabled: true
        cost_power: 1
        cost_weight: 1.0 #权重参数，从2.0降到1.0，减少对转弯的阻力
        offset_from_furthest: 4 #最远偏移量
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 2

      PathFollowCritic: #路径跟随评论家激励机器人沿着路径前进。
        enabled: true
        cost_power: 1
        cost_weight: 8.0 #权重参数，从5.0增大到8.0，增强路径跟随相对于避障的优先级
        offset_from_furthest: 15  #从5增大到15，增加前瞻距离，更好地跟随路径
        threshold_to_consider: 1.4 #机器人与目标之间的距离阈值，停止考虑路径跟随，并允许目标评论家接管。
#参数参考：https://docs.nav2.org/configuration/packages/configuring-mppic.html

      
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      transform_tolerance: 0.5  # 变换容差
      update_frequency: 10.0   #提高到10Hz，0.5m/s下每0.05m更新一次
      publish_frequency: 5.0  #与更新频率一致，MPPI读到的不再是过期数据
      global_frame: odom       #全局框架
      robot_base_frame: base_link  #机器人底座框架
      use_sim_time: False  #仿真时间
      rolling_window: true #成本地图是否应随机器人基座框架滚动
      width: 8             #代价地图的宽度（m）
      height: 8            #代价地图的高度（m）
      resolution: 0.05     #代价地图1像素的分辨率，以米为单位
      #robot_radius: 0.20   #机器人半径，如果未提供足迹坐标，则使用机器人半径。
      footprint: "[ [0.55, 0.37], [0.55, -0.37], [-0.55, -0.37], [-0.55, 0.37] ]"
      plugins: ["voxel_layer","inflation_layer"] #插件包括:{“体素层”，“障碍层”，“膨胀层”}
      inflation_layer:                             #膨胀层参数
        plugin: "nav2_costmap_2d::InflationLayer"  #膨胀层插件。
        cost_scaling_factor: 5.0                   #成本缩放因子，决定障碍物成本随距离的递减速度。
        inflation_radius: 0.50 #0.60暂时修改                     #从0.35改为0.40，必须≥内切半径0.38m
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"      #体素层插件。
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0                              #体素地图的起始Z坐标
        z_resolution: 0.05                         #体素地图的Z轴分辨率
        z_voxels: 16                               #体素地图的Z轴体素数量
        max_obstacle_height: 2.0                   #可检测障碍物的最大高度（米）
        mark_threshold: 0                          #标记体素的阈值
        observation_sources: scan                  #观测源
        scan:
          topic: /scan_fe
          max_obstacle_height: 2.0                  #可检测障碍物的最大高度（米）
          clearing: True                            #是否启用障碍物清除功能
          marking: True                             #是否启用障碍物标记功能
          data_type: "LaserScan"                    #数据类型
          raytrace_max_range: 4.5                   #从10.0降到4.5，略大于obstacle_max_range避免误清除
          raytrace_min_range: 0.0                   #控制光线追踪从代价地图中清除障碍物的最大范围
          obstacle_max_range: 4.0                   #提速后需要看得更远（5.6s×0.5m/s=2.8m，留余量3.5m）
          obstacle_min_range: 0.0                   #控制代价地图上标记障碍物的最小范围
          observation_persistence: 0.1              #观测数据保留1秒，超时未刷新的障碍物自动清除

      always_send_full_costmap: True                 #是否每次更新时都发送完整的成本图，而不是更新
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 0.5  # 变换容差
      update_frequency: 1.0             #成本地图更新频率，从1.0降到0.5减少重规划触发
      publish_frequency: 1.0            #将成本图发布到话题的频率，从1.0降到0.5
      global_frame: map                 #全局框架
      robot_base_frame: base_link  #机器人底座框架
      use_sim_time: False               #仿真时间
      #robot_radius: 0.20                #机器人半径
      footprint: "[ [0.55, 0.37], [0.55, -0.37], [-0.55, -0.37], [-0.55, 0.37] ]"
      resolution: 0.05                  #全局地图1像素的分辨率，以米为单位
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"] #插件包括：{“静态层”，“障碍层”，“膨胀层”}
      obstacle_layer:  #障碍层参数
        plugin: "nav2_costmap_2d::ObstacleLayer" #障碍层插件
        enabled: True
        observation_sources: scan                  #观测源
        scan:
          topic: /scan_fe
          max_obstacle_height: 2.0                 #可检测障碍物的最高高度（米）
          clearing: True                           #是否启用障碍物清除功能
          marking: True                            #是否启用障碍物标记功能
          data_type: "LaserScan"                   #数据类型
          raytrace_max_range: 6.0                 #控制光线追踪从代价地图中清除障碍物的最大范围
          raytrace_min_range: 0.0                  #控制光线追踪从代价地图中清除障碍物的最大范围
          obstacle_max_range: 5.0                  #控制代价地图上标记障碍物的最大范围，从2.5降到1.5减少全局代价地图波动
          obstacle_min_range: 0.0                  #控制代价地图上标记障碍物的最小范围
      static_layer: #静态层参数
        plugin: "nav2_costmap_2d::StaticLayer"     #静态层插件
        map_subscribe_transient_local: True
      inflation_layer: #膨胀层参数
        plugin: "nav2_costmap_2d::InflationLayer"  #膨胀层插件
        cost_scaling_factor: 10.0                   #成本缩放因子，决定障碍物成本随距离的递减速度。
        inflation_radius: 0.60                     #从0.35改为0.40，必须≥内切半径0.38m
      always_send_full_costmap: True               #是否每次更新时都发送完整的成本图，而不是更新
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "/home/nvidia/kybot_ws/123.yaml"  #  这个可能需要改一下

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0                #尝试保存地图的超时时间（秒）
    free_thresh_default: 0.25            #占用网格的自由空间最大概率阈值
    occupied_thresh_default: 0.65        #占用网格的占用空间最小概率阈值
    map_subscribe_transient_local: True  #地图话题的 QoS 设置

planner_server: #规划器服务器参数
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: False
    expected_planner_frequency: 1.0     #预期的规划器频率。如果当前频率小于预期频率，则显示警告消息。
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid" #Smac Hybrid-A* 规划器
      tolerance: 0.5                      # 如果无法达到精确的姿势，则规划的容差(单位m)
      downsample_costmap: false           # 是否将代价图下采样至另一个分辨率以进行搜索
      downsampling_factor: 1              # 对代价图进行下采样的乘数因子
      allow_unknown: false                # 允许在未知空间搜索
      max_iterations: 1000000             # 失败前搜索的最大迭代次数（以防无法到达），设置为 -1 以禁用
      max_on_approach_iterations: 1000    # 在公差范围内尝试达到目标的最大迭代次数，仅限 2D
      max_planning_time: 5.0              # 规划器进行规划、平滑和上采样的最大时间（以秒为单位）。
      motion_model_for_search: "REEDS_SHEPP"    # 2D Moore, Von Neumann; Hybrid Dubin, Redds-Shepp; State Lattice set internally
      cost_travel_multiplier: 3.5         #应用于搜索以避开高成本区域的成本乘数。
      # For 2D: Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
      angle_quantization_bins: 64         #用于 SE2 搜索的角度箱数量。这可以是任何偶数，但好的基线是 64 或 72（以 5 度为增量）32
      # For Hybrid/Lattice nodes: Number of angle bins for search, must be 1 for 2D node (no angle search)
      analytic_expansion_ratio: 3.5       #规划器将尝试以与该值和最小启发式方法成比例的频率完成分析扩展。
      # For Hybrid/Lattice nodes: The ratio to attempt analytic expansions during search for final approach.
      analytic_expansion_max_cost: 200.0
      minimum_turning_radius: 0.80        #最小转弯半径，实测直径1.6m→半径0.8m
      # For Hybrid/Lattice nodes: minimum turning radius in m of path / vehicle
      reverse_penalty: 1.2                #如果反向搜索，则对 SE2 节点应用启发式惩罚。
      # For Reeds-Shepp model: penalty to apply if motion is reversing, must be => 1
      change_penalty: 0.0                 #如果在搜索中改变方向（例如从左到右），则对 SE2 节点应用启发式惩罚。
      # For Hybrid nodes: penalty to apply if motion is changing directions, must be >= 0
      non_straight_penalty: 1.20          #如果在非直线方向上搜索，则对 SE2 节点应用启发式惩罚。
      # For Hybrid nodes: penalty to apply if motion is non-straight, must be => 1
      cost_penalty: 2.0                   #应用于 SE2 节点的姿势成本的启发式惩罚。
      # For Hybrid nodes: penalty to apply to higher cost areas when adding into the obstacle map dynamic programming distance expansion heuristic. This drives the robot more towards the center of passages. A value between 1.3 - 3.5 is reasonable.
      lookup_table_size: 20.0               #距离窗口的缓存大小
      # For Hybrid nodes: Size of the dubin/reeds-sheep distance window to cache, in meters.
      cache_obstacle_heuristic: false        #缓存障碍启发式，默认False环境如果是静态的（建好的地图），开 True 没问题，重规划会快很多。如果环境里有移动障碍物，改成 False。
      # For Hybrid nodes: Cache the obstacle map dynamic programming distance expansion heuristic between subsiquent replannings of the same goal location. Dramatically speeds up replanning performance (40x) if costmap is largely static.     
      smooth_path: true
      smoother:
        max_iterations: 1000 #平滑器平滑路径的最大迭代次数，以限制潜在的计算。
        w_smooth: 0.3 #应用于平滑数据点的平滑权重
        w_data: 0.2 #应用权重平滑以保留原始数据信息
        tolerance: 1.0e-10 #终止平滑会话的参数容差变化量
#参数参考：https://docs.nav2.org/configuration/packages/smac/configuring-smac-hybrid.html?highlight=nav2_smac_planner      
 
planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10 #TF transform tolerance.
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw           #用于在局部代价地图上进行碰撞检查的原始代价地图主题。
    footprint_topic: local_costmap/published_footprint #局部代价地图框架中的足迹主题。
    cycle_frequency: 10.0 #运行行为插件的频率。
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"] #插件包括：{“旋转”、“备份”、“前进”、“等待”}
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1 #TF 变换容差
    use_sim_time: False
    simulate_ahead_time: 2.0 #提前模拟
    max_rotational_vel: 0.5  #最大旋转速度（弧度/秒）
    min_rotational_vel: 0.05 #最小旋转速度（弧度/秒）
    rotational_acc_lim: 0.3  #最大旋转加速度（rad/s^2）

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 20 #循环速率
    stop_on_failure: false #如果单个航点失败，是否使操作任务失败。如果为 false，将继续到下一个航点。
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200 #机器人到达每个航点后休眠/等待的时间（以毫秒为单位）
#waypoint_follower 参数参考
#https://docs.nav2.org/configuration/packages/configuring-waypoint-follower.html?highlight=stop_on_failure
